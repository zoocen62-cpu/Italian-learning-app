<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Italian</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <h1>재미있는 Italian 배우기</h1>

    <section>
        <h2>오늘의 학습 문장</h2>
        <p lang="it">Buongiorno!</p>
        <p>안녕하세요!</p>
        <button type="button">다음 문장</button>
        <p>학습 진도: 1</p>
    </section>

    <section>
        <h2>단어 학습</h2>
        <ul>
            <li><span lang="it">ciao</span> — 안녕</li>
            <li><span lang="it">grazie</span> — 감사합니다</li>
            <li><span lang="it">acqua</span> — 물</li>
        </ul>
    </section>

    <section>
        <h2>퀴즈</h2>
        <p>‘감사합니다’를 이탈리아어로 어떻게 말할까요?</p>
        <label for="answer">정답</label>
        <input type="text" id="answer" name="answer">
        <button type="button">정답 확인</button>
    </section>
    <script src="script.js"></script>
</body>
</html>
